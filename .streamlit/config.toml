[theme]
base = "light"
primaryColor = "#4F6DF5"
backgroundColor = "#FCFCFB"
secondaryBackgroundColor = "#F1F3F7"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true
port = 8501
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# no tracebacks or developer menu for visitors; details go to the server log
showErrorDetails = "none"
toolbarMode = "viewer"

[runner]
magicEnabled = false
